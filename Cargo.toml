[package]
name = "cesar"
version = "0.0.7"
edition = "2024"
description = "The Init System of Cudane"
license = "MIT"

[dependencies]
cps = { git = "https://github.com/Mapuse/CPS", rev = "d8d5f7da49917ea7636147b8a65f3541311c45ab" }
tokio = { version = "1", features = ["full"] }
libc = "0.2"
nix = { version = "0.29", features = ["signal", "process"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
hostname = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[[bin]]
name = "csr"
path = "src/main.rs"

[[bin]]
name = "csl"
path = "src/bin/csl.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
