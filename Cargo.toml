[package]
name = "cesar"
version = "0.0.7"
edition = "2024"
description = "The Init System of Cudane"
license = "MIT"

[dependencies]
cps = { git = "https://github.com/Mapuse/CPS", rev = "c4ba21e185398558052acec3f0b4619b4e8c0678", default-features = false }
tokio = { version = "1", features = ["full"] }
libc = "0.2"
nix = { version = "0.29", features = ["signal", "process"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
python = ["cps/python"]

[[bin]]
name = "csr"
path = "src/main.rs"

[[bin]]
name = "csl"
path = "src/bin/csl.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Must stay "unwind": with panic="abort" any PID-1 panic becomes a kernel panic.
panic = "unwind"
strip = true
